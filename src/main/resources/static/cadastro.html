
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsePay - Cadastro</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #087f5b;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #066b4d;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #resultado {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #087f5b;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>PulsePay</h1>
    <p>Abra sua conta digital</p>

    <form id="formCadastro">

        <label for="name">Nome completo</label>
        <input
                type="text"
                id="name"
                maxlength="100"
                required
        >

        <label for="cpf">CPF (somente números)</label>
        <input
                type="text"
                id="cpf"
                inputmode="numeric"
                maxlength="11"
                pattern="[0-9]{11}"
                placeholder="00000000000"
                required
        >

        <label for="email">E-mail</label>
        <input
                type="email"
                id="email"
                maxlength="100"
                required
        >

        <label for="password">Criar senha</label>
        <input
                type="password"
                id="password"
                minlength="8"
                maxlength="72"
                placeholder="Mínimo de 8 caracteres"
                autocomplete="new-password"
                required
        >

        <label for="confirmPassword">Confirmar senha</label>
        <input
                type="password"
                id="confirmPassword"
                minlength="8"
                maxlength="72"
                placeholder="Digite a senha novamente"
                autocomplete="new-password"
                required
        >

        <button type="submit" id="botaoCadastrar">
            Cadastrar minha conta
        </button>

    </form>

    <div id="resultado"></div>

    <a href="/index.html">Voltar para minha carteira</a>

</div>

<script>
    document.getElementById("formCadastro")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const resultado = document.getElementById("resultado");
            const botao = document.getElementById("botaoCadastrar");

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                resultado.style.color = "#dc2626";
                resultado.textContent = "As senhas não são iguais.";
                return;
            }

            const dados = {
                name: document.getElementById("name").value.trim(),
                cpf: document.getElementById("cpf").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: password
            };

            botao.disabled = true;
            botao.textContent = "Cadastrando...";

            try {
                const resposta = await fetch("/api/accounts", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });

                const conteudo = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        conteudo.erro || "Não foi possível realizar o cadastro."
                    );
                }

                resultado.style.color = "#087f5b";
                resultado.textContent =
                    "Conta criada com sucesso! Número da conta: " + conteudo.id;

                document.getElementById("formCadastro").reset();

            } catch (erro) {
                resultado.style.color = "#dc2626";
                resultado.textContent = erro.message;

            } finally {
                botao.disabled = false;
                botao.textContent = "Cadastrar minha conta";
            }
        });
</script>

</body>
</html>
