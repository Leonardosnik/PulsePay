
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PulsePay</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071c3c, #1769aa);
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            color: #1769aa;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d4f85;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .register {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }

        .register:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">PulsePay</div>

    <p class="subtitle">Acesse sua carteira digital</p>

    <form id="loginForm">

        <label for="cpf">CPF</label>
        <input
                type="text"
                id="cpf"
                placeholder="Digite seu CPF"
                maxlength="11"
                inputmode="numeric"
                required
        >

        <label for="password">Senha</label>
        <input
                type="password"
                id="password"
                placeholder="Digite sua senha"
                required
        >

        <button type="submit" id="loginButton">Entrar</button>

    </form>

    <p class="message" id="message"></p>

    <a href="/cadastro.html" class="register">
        Ainda não tem conta? Cadastre-se
    </a>

</div>

<script>

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const cpf = document.getElementById("cpf").value.replace(/\D/g, "");
        const password = document.getElementById("password").value;

        message.style.color = "#333";
        message.textContent = "Verificando seus dados...";
        loginButton.disabled = true;

        try {

            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    cpf: cpf,
                    password: password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                message.style.color = "red";
                message.textContent = data.message || "CPF ou senha incorretos.";
                return;
            }

            message.style.color = "green";
            message.textContent = data.message;

            setTimeout(function() {
                window.location.href = "/carteira.html?accountId=" + data.accountId;
            }, 1000);

        } catch (error) {

            message.style.color = "red";
            message.textContent = "Não foi possível conectar ao servidor.";

        } finally {

            loginButton.disabled = false;

        }

    });

</script>

</body>
</html>
